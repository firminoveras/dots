    cx = 1280.0
    cy = 961.0
    output = "HDMI-A-1"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
border = false
layer = "overlay"

[osd]
background_opacity = 0.4999999888241291
border = false
offset_x = 40
orientation = "vertical"
position_vertical = "center_right"
scale = 0.80000000447034836

    [osd.kinds]
    media = false

[plugin_settings."alexander/screen-toolkit"]
selected-ocr-lang = "pt"

[plugin_settings."baizhu/paged-todo"]
export_path = "~/Documents/Todos/"

[plugin_settings."nightwatch75/todo"]
todo_folder = "~/Documentos/Todo"

[plugin_settings."oldirtty/color_picker"]
panel_open_near_click = true
panel_placement = "attached"

[plugin_settings."yuki/lunar-workspaces"]
compositor = "hyprland"

[plugins]
enabled = [
    "noctalia/screen_recorder",
    "thepunkoff/pomodoro",
    "alexander/screen-toolkit",
    "weinguyen/procmon",
    "baizhu/paged-todo",
    "baizhu/input-echo-bar",
    "tordex/processes"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
app_icon_color = "primary"
app_icon_colorize = true
button_borders = false
card_borders = false
clipboard_history_max_entries = 800
corner_radius_scale = 2.0
font_family = "Google Sans Display Medium"
input_borders = false
panel_anchor_bar = "barFocus"
password_style = "random"
polkit_agent = true
popup_borders = false
popup_shadows = false
settings_show_advanced = true

    [shell.launcher.providers.windows]
    global = true

    [shell.panel]
    borders = false
    clipboard_placement = "attached"
    launcher_placement = "attached"
    list_item_background = true
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_wallpaper = true
    polkit_placement = "attached"
    shadow = false
    transparency_mode = "solid"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    annotate = true
    confirm_region = true
    remember_last_region = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "x"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "q"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "s"
    variant = "destructive"

    [shell.window_switcher]
    mru = false

[system.monitor]
cpu_poll_seconds = 1
cpu_temp_activity_threshold = 80
cpu_temp_critical_threshold = 90
gpu_poll_seconds = 1

[theme]
builtin = "Ayu"
community_palette = "Macaron"
custom_palette = "focus"
mode = "dark"
pure_black_dark = false
source = "custom"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]

        [theme.templates.user.hyprland]
        input_path = "./templates/hyprland/colors.lua"
        output_path = "~/.config/hypr/custom/colors.lua"

        [theme.templates.user.kitty]
        input_path = "./templates/kitty/theme.conf"
        output_path = "~/.config/kitty/theme.conf"

        [theme.templates.user.nchat]
        input_path = "./templates/nchat/color.conf"
        output_path = "~/.config/nchat/color.conf"

        [theme.templates.user.nchatuser]
        input_path = "./templates/nchat/usercolor.conf"
        output_path = "~/.config/nchat/usercolor.conf"

        [theme.templates.user.nvim-base16]
        input_path = "./templates/nvim/colors.lua"
        output_path = "~/.config/nvim/lua/plugins/colors.lua"
        post_hook = "pkill -SIGUSR1 nvim"

        [theme.templates.user.sddm]
        input_path = "./templates/sddm/theme.conf"
        output_path = "~/.config/sddm-theme/theme.conf"
        post_hook = "ln -sf {{image}} ~/.config/sddm-theme/assets/background.jpg && ln -sf ~/Imagens/avatar/.face ~/.config/sddm-theme/assets/avatar.jpg"

        [theme.templates.user.studio_editor]
        input_path = "./templates/android-studio/editor_template.xml"
        output_path = "/tmp/studio-noctalia-theme/matugen.xml"

        [theme.templates.user.studio_ui]
        input_path = "./templates/android-studio/ui_template.json"
        output_path = "/tmp/studio-noctalia-theme/matugen.theme.json"
        post_hook = "bash -c '~/.config/noctalia/templates/android-studio/apply.sh'"

        [theme.templates.user.surfingkeys]
        input_path = "./templates/surfingkeys/surfingkeys.js"
        output_path = "~/.config/surfingkeys/surfingkeys.js"

        [theme.templates.user.wlkbptr]
        input_path = "./templates/wl-kbptr/config"
        output_path = "~/.config/wl-kbptr/config"

        [theme.templates.user.yazi]
        input_path = "./templates/yazi/theme.toml"
        output_path = "~/.config/yazi/theme.toml"

[wallpaper]
directory = "/home/firmino/Imagens/Wallpapers"
transition = [ "disc" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/firmino/Imagens/Wallpapers/a_screenshot_of_a_video_game_3.png"

    [wallpaper.last]
    path = "/home/firmino/Imagens/Wallpapers/a_screenshot_of_a_video_game_3.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/firmino/Imagens/Wallpapers/linux_4.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/firmino/Imagens/Wallpapers/a_screenshot_of_a_video_game_3.png"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/firmino/Imagens/Wallpapers/linux_4.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

    [[wallpaper.favorite]]
    path = "/home/firmino/Imagens/Wallpapers/a_skeleton_with_a_skull_and_arms.jpg"
    theme_mode = "auto"

[widget.active_window]
display = "text_only"
max_length = 626
min_length = 55
title_scroll = "on_hover"

[widget.audio_visualizer]
bands = 64
width = 192

[widget.bar]
color = "primary"
icon_color = "primary"
type = "baizhu/paged-todo:bar"

[widget.battery]
display_mode = "graphic"
hide_when_full = true
label_content = "percent"
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
anchor = true
format = "{:%H:%M}"

[widget.cpu]
show_value = false
visualization = "gauge"

[widget.focus_battery]
display_mode = "none"
hide_when_full = true
type = "battery"

[widget.focus_weather]
type = "weather"

[widget.focus_workspace]
color = "surface_variant"
empty_color = "surface"
focused_color = "primary"
icon_color = "tertiary"
label_source = "id"
occupied_color = "outline"
style = "minimal"
type = "workspaces"

[widget.input_volume]
show_label = false

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.ram]
show_value = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.recorder_3]
type = "noctalia/screen_recorder:recorder"

[widget.space_end]
length = 4
type = "spacer"

[widget.sysmon]
