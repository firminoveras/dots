config_version = 14

[audio]
enable_overdrive = true

[bar]
order = [ "default", "sideBar", "sideBar2", "barFocus" ]

    [bar.barFocus]
    background_opacity = 0.99999997764825821
    capsule = false
    capsule_thickness = 0.99999998137354851
    center = [ "focus_weather", "clock", "bar" ]
    color = "primary"
    concave_edge_corners = false
    contact_shadow = false
    enabled = true
    end = [ "toggle_2", "focus_battery", "widget_2" ]
    font_family = "MonoLisa Nerd Font"
    font_weight = 900
    hover_highlight = false
    icon_color = "secondary"
    layer = "top"
    margin_ends = 0
    panel_overlap = 1
    position = "top"
    radius = 0
    reserve_space = true
    scale = 0.85000000521540642
    shadow = false
    start = [ "focus_workspace", "active_window" ]
    thickness = 29
    widget_spacing = 26

    [bar.default]
    background_opacity = 0.4999999888241291
    center = [ "audio_visualizer", "clock", "workspaces", "weather", "audio_visualizer" ]
    enabled = false
    end = [ "battery", "group:g1", "notifications", "session", "space_end" ]
    font_family = "Google Sans Display"
    margin_edge = 6
    margin_ends = 6
    padding = 4
    radius = 24
    shadow = false
    start = [ "taskbar" ]
    thickness = 28
    widget_spacing = 12

        [[bar.default.capsule_group]]
        border = ""
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "cpu", "temp", "ram", "sysmon" ]
        opacity = 0.0
        padding = 6.0

    [bar.sideBar]
    auto_hide = true
    background_opacity = 0.4999999888241291
    center = [ "brightness", "input_volume", "volume_interativo", "network", "bluetooth" ]
    enabled = true
    end = []
    layer = "overlay"
    margin_ends = 420
    position = "right"
    radius = 24
    reserve_space = false
    scale = 0.85000000521540642
    show_on_workspace_switch = false
    start = []
    thickness = 32
    widget_spacing = 20

    [bar.sideBar2]
    auto_hide = true
    background_opacity = 0.4999999888241291
    center = [ "widget_3", "screenshot", "recorder_3", "widget_4" ]
    enabled = true
    end = []
    layer = "overlay"
    margin_ends = 420
    position = "left"
    radius = 24
    reserve_space = false
    scale = 0.85000000521540642
    show_on_workspace_switch = false
    start = []
    thickness = 32
    widget_spacing = 20

[calendar]
enabled = true

    [calendar.account.personal_google]
    name = "Firmino"
    type = "google"

[desktop_widgets]
enabled = false

[hooks]
wallpaper_changed = "~/.config/noctalia/scripts/apply_colors.sh \"$NOCTALIA_WALLPAPER_PATH\""

[location]
address = "Água Branca, PB"

[lockscreen_widgets]
