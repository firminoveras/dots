inactive_opacity = 0.59999999999999998
occupied_color = "secondary"
scale = 0.90000000000000002
show_active_indicator = false
workspace_group_content = "icons"
workspace_label_placement = "centered"

[widget.temp]
show_value = false

[widget.toggle_2]
type = "decksters-lab/palette-creator:toggle"

[widget.volume]
show_label = false

[widget.volume_interativo]
anchor = true
glyph = "volume"
scroll_repeat = "steps"
type = "custom_button"

    [widget.volume_interativo.actions]
    left = "volume-mute"
    scroll_down = "volume-down 5"
    scroll_up = "volume-up 5"

[widget.weather]
show_condition = false

[widget.widget_2]
font_family = "MonoLisa Nerd Font"
font_weight = 900
type = "weinguyen/procmon:widget"

[widget.widget_3]
type = "thepunkoff/pomodoro:widget"

[widget.widget_4]
type = "alexander/screen-toolkit:widget"

[widget.workspaces]
active_pill_size = 2.0
anchor = true
empty_color = "on_primary"
focused_color = "primary"
inactive_pill_size = 1.0
occupied_color = "secondary"
pill_scale = 0.90000000000000002
show_labels = false
style = "regular"