config_version = 10

[bar]
order = [ "default", "sideBar", "sideBar2" ]

    [bar.default]
    background_opacity = 0.4999999888241291
    center = [ "audio_visualizer", "clock", "workspaces", "weather", "audio_visualizer" ]
    end = [ "battery", "group:g1", "notifications", "session", "space_end" ]
    font_family = "Google Sans Display"
    margin_edge = 6
    margin_ends = 6
    padding = 4
    radius = 24
    start = [ "taskbar" ]
    thickness = 28
    widget_spacing = 12

        [[bar.default.capsule_group]]
        border = ""
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "cpu", "temp", "ram", "sysmon" ]
        opacity = 0.0
        padding = 6.0

    [bar.sideBar]
    auto_hide = true
    background_opacity = 0.4999999888241291
    center = [ "brightness", "input_volume", "volume_interativo", "network", "bluetooth" ]
    enabled = true
    end = []
    layer = "overlay"
    margin_ends = 420
    position = "right"
    radius = 24
    reserve_space = false
    scale = 0.85000000521540642
    show_on_workspace_switch = false
    start = []
    thickness = 32
    widget_spacing = 20

    [bar.sideBar2]
    auto_hide = true
    background_opacity = 0.4999999888241291
    center = [ "widget_3", "widget_4", "todo_2", "screenshot", "recorder_3" ]
    enabled = true
    end = []
    layer = "overlay"
    margin_ends = 420
    position = "left"
    radius = 24
    reserve_space = false
    scale = 0.85000000521540642
    show_on_workspace_switch = false
    start = []
    thickness = 32
    widget_spacing = 20

[calendar]
enabled = true

    [calendar.account.personal_google]
    name = "Firmino"
    type = "google"

[desktop_widgets]
enabled = false

[location]
address = "Água Branca, PB"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 961.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

[osd]
background_opacity = 0.4999999888241291
border = false
offset_x = 40
orientation = "vertical"
position_vertical = "center_right"
scale = 0.80000000447034836

    [osd.kinds]
    media = false

[plugin_settings."nightwatch75/todo"]
todo_folder = "~/Documentos/Todo"

[plugin_settings."oldirtty/color_picker"]
panel_open_near_click = true
panel_placement = "attached"

[plugins]
enabled = [ "noctalia/screen_recorder", "oldirtty/color_picker", "nightwatch75/todo", "thepunkoff/pomodoro" ]

[shell]
app_icon_color = "primary"
app_icon_colorize = true
button_borders = false
clipboard_history_max_entries = 800
corner_radius_scale = 2.0
font_family = "Google Sans Display Medium"
input_borders = false
password_style = "random"
polkit_agent = true
popup_borders = false

    [shell.launcher.providers.windows]
    global = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_wallpaper = true
    polkit_placement = "attached"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    confirm_region = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "x"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "q"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "s"
    variant = "destructive"

[system.monitor]
cpu_poll_seconds = 1
cpu_temp_activity_threshold = 80
cpu_temp_critical_threshold = 90
gpu_poll_seconds = 1

[theme]
builtin = "Ayu"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]

        [theme.templates.user.hyprland]
        input_path = "./templates/hyprland/colors.lua"
        output_path = "~/.config/hypr/custom/colors.lua"

        [theme.templates.user.kitty]
        input_path = "./templates/kitty/theme.conf"
        output_path = "~/.config/kitty/theme.conf"

        [theme.templates.user.nchat]
        input_path = "./templates/nchat/color.conf"
        output_path = "~/.config/nchat/color.conf"

        [theme.templates.user.nchatuser]
        input_path = "./templates/nchat/usercolor.conf"
        output_path = "~/.config/nchat/usercolor.conf"

        [theme.templates.user.nvim-base16]
        input_path = "./templates/nvim/colors.lua"
        output_path = "~/.config/nvim/lua/plugins/colors.lua"
        post_hook = "pkill -SIGUSR1 nvim"

        [theme.templates.user.sddm]
        input_path = "./templates/sddm/theme.conf"
        output_path = "~/.config/sddm-theme/theme.conf"
        post_hook = "ln -sf {{image}} ~/.config/sddm-theme/assets/background.jpg && ln -sf ~/Imagens/avatar/.face ~/.config/sddm-theme/assets/avatar.jpg"

        [theme.templates.user.studio_editor]
        input_path = "./templates/android-studio/editor_template.xml"
        output_path = "/tmp/studio-noctalia-theme/matugen.xml"

        [theme.templates.user.studio_ui]
        input_path = "./templates/android-studio/ui_template.json"
        output_path = "/tmp/studio-noctalia-theme/matugen.theme.json"
        post_hook = "bash -c '~/.config/noctalia/templates/android-studio/apply.sh'"

        [theme.templates.user.surfingkeys]
        input_path = "./templates/surfingkeys/surfingkeys.js"
        output_path = "~/.config/surfingkeys/surfingkeys.js"

        [theme.templates.user.wlkbptr]
        input_path = "./templates/wl-kbptr/config"
        output_path = "~/.config/wl-kbptr/config"

        [theme.templates.user.yazi]
        input_path = "./templates/yazi/theme.toml"
        output_path = "~/.config/yazi/theme.toml"

[wallpaper]
directory = "/home/firmino/Imagens/Wallpapers"
transition = [ "disc" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/firmino/Imagens/Wallpapers/abstract_6.jpg"

    [wallpaper.last]
    path = "/home/firmino/Imagens/Wallpapers/abstract_6.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/firmino/Imagens/Wallpapers/linux_4.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/firmino/Imagens/Wallpapers/abstract_6.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/firmino/Imagens/Wallpapers/linux_4.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

[widget.audio_visualizer]
bands = 64
width = 192

[widget.battery]
display_mode = "graphic"
hide_when_full = true
hide_when_plugged = true
show_label = false

[widget.brightness]
show_label = false

[widget.cpu]
show_label = false
show_value = false
visualization = "gauge"

[widget.input_volume]
show_label = false

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.ram]
show_label = false
show_value = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.recorder_3]
type = "noctalia/screen_recorder:recorder"

[widget.space_end]
length = 4
type = "spacer"

[widget.sysmon]
glyph = "gpu-usage"
show_value = false
stat = "gpu_usage"

[widget.taskbar]
group_by_workspace = true
hide_empty_workspaces = true
inactive_opacity = 0.80000000000000004
minimal = true
occupied_color = "outline"
scale = 0.80000000000000004
show_active_indicator = false
show_workspace_label = false
workspace_label_placement = "inside"

[widget.temp]
show_label = false
show_value = false

[widget.todo_2]
type = "nightwatch75/todo:todo"

[widget.volume]
show_label = false

[widget.volume_interativo]
anchor = true
glyph = "volume"
type = "custom_button"

    [widget.volume_interativo.actions]
    left = "volume-mute"
    scroll_down = "volume-down 5"
    scroll_up = "volume-up 5"

[widget.weather]
show_condition = false

[widget.widget_3]
type = "thepunkoff/pomodoro:widget"

[widget.widget_4]
type = "oldirtty/color_picker:widget"

[widget.workspaces]
anchor = true
display = "none"
occupied_color = "tertiary"
pill_scale = 0.80000000000000004
style = "regular"